[tool.poetry]
name = "xlsx-converter"
version = "0.1.0"
description = "MAX-бот xlsx-converter: приём/возврат xlsx с доступом по времени через админку"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
asyncpg = "^0.30"
sqladmin = "^0.20"
pydantic-settings = "^2.6"
maxapi = "^1.2"
itsdangerous = "^2.2"
apscheduler = "^3.11.3"

[tool.poetry.group.dev.dependencies]
mypy = "^1.13"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
